name: Ad Pipeline — Placements + JPGs

# Runs two ETLs that share the SharePoint client:
#   1. Ad Placements — pulls CO + UT placement spreadsheets from
#      Sales (Corner)/Design CO|UT. No-op skips when neither file
#      has changed since the previous run.
#   2. Ad JPGs — discovers new image files in Design CO|UT|TX,
#      mirrors to the 'client_ads' Supabase Storage bucket, and
#      inserts metadata rows. Skips whole subfolders whose mtime
#      hasn't moved since the last run.
#
# Schedule: every Friday 15:00 UTC (~11 AM ET DST, 10 AM ET std).
# Most runs will be near-instant no-ops; the audit log still gets
# a row so you can see the pipeline is healthy.
#
# Manual dispatch supports both ETLs with dry-run + a JPG year-min
# filter (for one-off backfill scenarios).

on:
  schedule:
    - cron: "0 15 * * 5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — fetch + validate + count, but no DB or Storage writes"
        type: boolean
        required: false
        default: false
      jpg_year_min:
        description: "JPGs only: skip subfolders whose name year < this (e.g. 2025). Leave blank for default mtime-based skipping."
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Two runs racing each other on the same upsert keys would just produce
# duplicate audit rows for the same writes — annoying, not destructive.
# Block concurrent runs to keep the log clean.
concurrency:
  group: ad-pipeline
  cancel-in-progress: false

jobs:
  placements:
    name: Ad Placements
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ad Placements ETL
        run: |
          python etl/etl_ad_placements.py --source sharepoint \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

  jpgs:
    name: Ad JPGs
    runs-on: ubuntu-latest
    timeout-minutes: 60  # longer — each new file triggers a SP download + Supabase upload

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ad JPGs ETL
        run: |
          python etl/etl_ad_jpgs.py \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }} \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.jpg_year_min != '') && format('--year-min {0}', inputs.jpg_year_min) || '' }}

  vision_extract:
    name: Ad Vision Extraction (v2)
    needs: jpgs
    runs-on: ubuntu-latest
    timeout-minutes: 90  # incremental run is fast; gives margin for any backlog

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run vision extraction (incremental)
        # Processes any client_ads row whose extraction is NULL or _version
        # is not 2. With the wildcard '%' issue pattern + the default
        # skip-already-v2 behavior, the scope is naturally just "whatever
        # the JPG ETL added today + any leftovers from prior runs". A
        # typical Friday: ~50-200 new ads, ~$0.30-1.10, a couple minutes.
        run: |
          python scripts/ad_vision_v2.py --issue-pattern '%' --workers 5
