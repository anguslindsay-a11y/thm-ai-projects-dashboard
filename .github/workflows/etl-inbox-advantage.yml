name: IA ETL — Inbox Advantage

# Pulls the IA spreadsheet from SharePoint and upserts campaigns + client links
# into Supabase. Idempotent — re-running with the same source file produces
# zero net data changes (only updated_at timestamps shift).
#
# Runs Friday 14:00 UTC (10 AM ET DST / 9 AM ET standard time). Captures any
# updates Inside Sales made during the week before the weekend.
#
# Manual trigger ("Run workflow" button) supports a dry-run toggle for testing
# without writing to Supabase.

on:
  schedule:
    - cron: "0 14 * * 5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — fetch, validate, count rows, but write nothing"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# Prevent two simultaneous runs from racing on the upsert (idempotent, but
# avoids confusing audit-log interleaving).
concurrency:
  group: ia-etl
  cancel-in-progress: false

jobs:
  run:
    name: Run IA ETL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Supabase
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # SharePoint / Microsoft Graph
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      SHAREPOINT_IA_SITE_URL: ${{ secrets.SHAREPOINT_IA_SITE_URL }}
      SHAREPOINT_IA_FILE_PATH: ${{ secrets.SHAREPOINT_IA_FILE_PATH }}
      # Failure-alert email (reuses scripts/import_report.send_email)
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run IA ETL
        run: |
          python etl/etl_inbox_advantage.py \
            --source sharepoint \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
