name: MagManager — Contacts + Opportunities + Activities

# Daily sync of the three accessible MagManager API endpoints.
#
# Why one job instead of three: order matters. Contacts must finish first so
# Opportunities and Activities can resolve their (mm_database, mm_customer_id)
# -> client_id lookups against the freshest client data. A single job with
# three sequential steps gives us that natural ordering + fail-fast behavior
# (if Contacts dies, the rest don't run).
#
# Schedule: every day at 12:00 UTC (~6 AM MDT / 5 AM MST). Data is fresh
# before the sales team starts their day.
#
# Skip-if-unchanged is built into each ETL:
#   - Contacts skip rows where mm_date_modified prefix matches
#   - Opportunities skip rows where mm_modified_date prefix matches
#   - Activities use upsert on the unique constraint (immutable rows; dupes
#     are silently no-ops)
#
# Activities pulls --days 7 to catch any drift from missed runs / outages.
# Anything older has already been backfilled. Re-ingesting up to 7 days of
# activities is cheap (~15s) and safe (upsert).
#
# When Mirabel grants Orders/Products/PubSchedule endpoints, add new steps
# in dependency order: Contacts -> Products -> Orders -> Opportunities -> Activities.

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — fetch + plan but no DB writes"
        type: boolean
        required: false
        default: false
      activities_days:
        description: "Activities: days back to pull (default 7 for daily; bump to 30 if you've missed several days)"
        type: string
        required: false
        default: "7"

permissions:
  contents: read

# Prevent overlapping runs from racing on the same upsert keys.
concurrency:
  group: magmanager-etl
  cancel-in-progress: false

jobs:
  sync:
    name: MagManager Daily Sync
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      MAGMANAGER_API_KEY: ${{ secrets.MAGMANAGER_API_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      NOTIFY_EMAILS: ${{ secrets.NOTIFY_EMAILS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "[1/3] Contacts sync"
        # Establishes the client lookup for the rest of the pipeline.
        run: |
          python etl/etl_mm_contacts.py \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: "[2/3] Opportunities sync"
        # Depends on Contacts so client_id resolution uses the latest data.
        run: |
          python etl/etl_mm_opportunities.py \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: "[3/3] Activities sync"
        # Incremental window. Anything older was covered by the 3-year backfill.
        # The upsert key (mm_database, mm_activity_id) makes re-ingest safe,
        # so widening the window from 7 -> 30 days during recovery has no
        # downside besides a few extra seconds.
        run: |
          python etl/etl_mm_activities.py \
            --days ${{ github.event_name == 'workflow_dispatch' && inputs.activities_days || '7' }} \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
